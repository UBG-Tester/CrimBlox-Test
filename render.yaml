services:
  - type: web
    name: crimblox-web-engine
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
  - type: static
    name: crimblox-engine-static
    plan: free
    region: ohio
    buildCommand: ""
    staticPublishPath: .
    autoDeploy: true
