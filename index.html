<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Crimson Web Engine</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;font:14px/1.2 "Source Sans Pro","Segoe UI",system-ui,Arial,sans-serif;color:#fff;user-select:none}
canvas{display:block;width:100%;height:100%}
#bar{position:fixed;left:0;right:0;top:0;height:36px;display:flex;align-items:center;padding:0 6px;background:rgba(25,25,25,0.6)}
#bar svg{width:24px;height:24px;margin:0 10px 0 4px}
.tb{background:none;border:0;border-radius:0;color:#fff;font:inherit;padding:0 12px;height:36px;cursor:pointer;opacity:.85}
.tb:hover{opacity:1;background:rgba(255,255,255,.12)}
#panel{position:fixed;right:8px;top:44px;width:380px;background:rgba(25,25,25,0.72);display:none;padding:8px;box-sizing:border-box}#panel.show{display:block}
#src{width:100%;height:200px;box-sizing:border-box;background:rgba(0,0,0,.45);color:#e8e8e8;border:0;font:12px/1.35 ui-monospace,Consolas,monospace;padding:6px;resize:vertical;user-select:text}
#out{height:110px;overflow:auto;white-space:pre-wrap;font:12px/1.3 ui-monospace,Consolas,monospace;color:#cfe;margin-top:6px;user-select:text}
#run{background:#4b974b;color:#fff;border:0;padding:6px 14px;cursor:pointer;margin-top:6px}
#hud{position:fixed;left:8px;bottom:8px;white-space:pre;text-shadow:0 1px 2px #000;opacity:.9}</style></head>
<body><canvas id="c"></canvas>
<div id="bar"><svg viewBox="0 0 24 24" aria-label="CrimBlox"><rect x="5" y="5" width="14" height="14" transform="rotate(-14 12 12)" fill="none" stroke="#cfcfcf" stroke-width="4" stroke-dasharray="42 14"/></svg>
<button class="tb" id="scriptBtn">Script</button><button class="tb" id="openBtn">Open…</button><button class="tb" id="saveXml">Save .cblx</button><button class="tb" id="saveBin">Save .cbxm</button>
<button class="tb" id="skyBtn">Skybox…</button><button class="tb" id="skyReset">Procedural Sky</button>
<input id="skyFile" type="file" accept="image/*" hidden><input id="openFile" type="file" accept=".cblx,.cbxm,.txt" hidden></div>
<div id="panel"><textarea id="src" spellcheck="false"></textarea><button id="run">Run on server</button><div id="out"></div></div>
<div id="hud">Loading…</div>
<script type="module" src="src/main.js"></script></body></html>
